name: personal_digicam
description: "Aesthetic Digicam - Premium Mobile Camera & Photo Editing App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  http: ^1.2.2
  crypto: ^3.0.3
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_photos/
    - assets/stickers/
